spring:
  application:
    name: webiados-cotizaciones-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/cotizaciones}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${PORT:8080}
  # Compresión gzip de las respuestas. Viene apagada por defecto en Spring Boot. En
  # Railway el egress se cobra; para una API JSON el ahorro es grande (medido en otro
  # servicio del ecosistema: 400 KB → 63 KB, ~84%). Cuesta algo de CPU, que sí está
  # incluida en el plan. Se comprime desde 1 KB para arriba.
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain,text/css,application/javascript
    min-response-size: 1024

app:
  jwt:
    # SIN default a propósito: un secreto no tiene valor por defecto. Si JWT_SECRET no está
    # definido, el servicio se niega a arrancar (ver JwtService). Un default cómodo dejaría
    # producción firmando tokens con un secreto público y nadie se enteraría.
    secret: ${JWT_SECRET}
    admin-ttl-minutes: ${JWT_ADMIN_TTL:480}
    client-ttl-minutes: ${JWT_CLIENT_TTL:30}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  quote:
    validity-days: ${QUOTE_VALIDITY_DAYS:15}
    # Base de la landing que ve el cliente (la sirve el frontend Angular).
    public-base-url: ${QUOTE_PUBLIC_BASE_URL:https://webiados.com/cotizacion}
  stale-alert:
    # Apagado por defecto (regla 13). Se prende con esta variable, a propósito.
    enabled: ${QUOTE_STALE_ALERT_ENABLED:false}
    days: ${QUOTE_STALE_ALERT_DAYS:7}
  mail:
    from: ${MAIL_FROM:cotizaciones@webiados.com}
    notify-to: ${NOTIFY_TO:contacto@webiados.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://webiados.com,https://www.webiados.com,https://cotiza.webiados.com,http://localhost:4200}
  ratelimit:
    unlock-max-attempts: ${RATELIMIT_UNLOCK_MAX:5}
    unlock-window-minutes: ${RATELIMIT_UNLOCK_WINDOW:10}
  pricing:
    # Catálogo del Core (fuente de verdad: pricing.md). Se consume verbatim, sin convertir.
    url: ${PRICING_URL:https://core.webiados.com/api/v1/pricing}
    timeout-seconds: ${PRICING_TIMEOUT_SECONDS:5}
  leads:
    # CRM del Core. El formulario postea al Core; acá se LEE un lead al convertirlo en cotización.
    url: ${LEADS_URL:https://core.webiados.com/api/v1/leads}
    # Llave de tenant del Core (Bearer). Sin default: si falta, convertir un lead falla con aviso;
    # el servicio arranca igual (la conversión de leads es opcional).
    api-key: ${CORE_API_KEY:}
    timeout-seconds: ${LEADS_TIMEOUT_SECONDS:5}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

logging:
  level:
    org.flywaydb: INFO
